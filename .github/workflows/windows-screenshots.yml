# Takes real screenshots of the Windows app (made-up demo data, no network) on a GitHub Windows
# machine and commits them to docs/screenshots/windows on the windows branch.
# Nothing is uploaded as an Actions artifact.
name: Windows screenshots

on:
  push:
    branches: [windows]
    paths: ["windows/**", ".github/workflows/windows-screenshots.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pillow

      - name: Take screenshots
        run: python windows/xdrip_tray.py --screenshots docs/screenshots/windows

      - name: Commit them
        shell: bash
        run: |
          set -euo pipefail
          cat docs/screenshots/windows/index.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/windows
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update Windows screenshots"
          git pull --rebase origin windows
          git push origin HEAD:windows
