# Builds xDripTray.exe on Windows and publishes it as a GitHub Release (tag windows-vX.Y.Z).
# Releases do not use the Actions artifact storage quota.
#
# Every build gets a GitHub build attestation (signed proof it was built here, from this commit):
#   gh attestation verify xDripTray.exe --repo <owner>/<repo>
#
# Code signing (SignPath Foundation) switches itself on once the repository variable
# SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN exist (see windows/SIGNING.md).
# SignPath can only take the file as an Actions artifact, so in that case the unsigned .exe is
# uploaded with 1-day retention and deleted again as soon as the signed file is back.
name: Windows build

on:
  push:
    branches: [windows]
    paths: ["windows/**", "collector/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write          # create the release
  id-token: write          # build attestation
  attestations: write      # build attestation
  actions: write           # delete the temporary artifact after signing

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pystray pillow keyring cryptography zxing-cpp

      - name: Collector self-test
        run: python collector/xdrip_gnome_collector.py --selftest

      - name: Build xDripTray.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name xDripTray
          --paths collector --paths windows
          --hidden-import keyring.backends.Windows --hidden-import pystray._win32
          --collect-submodules keyring
          windows/xdrip_tray.py

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\xDripTray.exe" -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      - name: Upload unsigned exe for signing (temporary)
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: xDripTray-unsigned
          path: dist/xDripTray.exe
          retention-days: 1
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'xdrip-gnome-topbar' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed exe and delete the temporary artifact
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp -f signed/xDripTray.exe dist/xDripTray.exe
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ steps.unsigned.outputs.artifact-id }}" || true

      - name: Self-test the signed exe
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\xDripTray.exe
          "Signature: $($sig.Status) by $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "signature is not valid" }
          $out = Join-Path $env:RUNNER_TEMP "selftest2.txt"
          $p = Start-Process -FilePath "dist\xDripTray.exe" -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      - name: Build attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/xDripTray.exe

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' windows/xdrip_tray.py)
          tag="windows-v${version}"
          if [ -n "${{ vars.SIGNPATH_ORGANIZATION_ID }}" ]; then
            SIGNED_NOTE="Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org)."
          else
            SIGNED_NOTE="Code signing through the SignPath Foundation open-source programme is planned. Until then, Windows SmartScreen shows a one-time warning on first run (see the instructions)."
          fi
          (cd dist && sha256sum xDripTray.exe > xDripTray.exe.sha256)
          cat > notes.md <<NOTES
          Windows tray app + floating widget for xDrip+ Cloud Sync, version ${version}.

          Download **xDripTray.exe** and follow [the Windows instructions](https://github.com/${{ github.repository }}/blob/windows/windows/README.md).

          **Check the download:** this .exe was built by GitHub Actions from commit ${{ github.sha }} of this repository. GitHub has signed a record of that build, and you can verify it with \`gh attestation verify xDripTray.exe --repo ${{ github.repository }}\`, or compare the SHA-256 with \`xDripTray.exe.sha256\`. ${SIGNED_NOTE}

          ### Screenshots

          ![The 48-hour graph](https://raw.githubusercontent.com/Electrik-rich546456/xdrip-gnome-topbar/windows/docs/screenshots/windows/graph.png)

          | Floating widget | Tray icon | Settings |
          |---|---|---|
          | ![Widget](https://raw.githubusercontent.com/Electrik-rich546456/xdrip-gnome-topbar/windows/docs/screenshots/windows/widget.png) | ![Tray icon](https://raw.githubusercontent.com/Electrik-rich546456/xdrip-gnome-topbar/windows/docs/screenshots/windows/tray-icon.png) | ![Settings](https://raw.githubusercontent.com/Electrik-rich546456/xdrip-gnome-topbar/windows/docs/screenshots/windows/settings-collector.png) |

          More in [the Windows guide](https://github.com/${{ github.repository }}/blob/windows/windows/README.md#screenshots). Screenshots are taken automatically with made-up readings.

          Not a medical device: rely on xDrip+ for alarms.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            # Same version built again (e.g. only docs changed): keep the published .exe, because
            # replacing it resets its download count. Only the release notes are refreshed.
            # To publish new code, increase VERSION in windows/xdrip_tray.py.
            echo "Release $tag already exists: updating the notes only, the .exe is kept."
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" dist/xDripTray.exe dist/xDripTray.exe.sha256 \
              --target "${{ github.sha }}" --title "xDrip+ Tray for Windows ${version}" --notes-file notes.md
          fi
