# Builds xDripTray.exe on Windows and publishes it as a GitHub Release (tag windows-vX.Y.Z).
# Releases do not use the Actions artifact storage quota, so nothing is uploaded as an artifact.
name: Windows build

on:
  push:
    branches: [windows]
    paths: ["windows/**", "collector/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write          # needed to create the release

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pystray pillow keyring cryptography zxing-cpp

      - name: Collector self-test
        run: python collector/xdrip_gnome_collector.py --selftest

      - name: Build xDripTray.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name xDripTray
          --paths collector --paths windows
          --hidden-import keyring.backends.Windows --hidden-import pystray._win32
          --collect-submodules keyring
          windows/xdrip_tray.py

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\xDripTray.exe" -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' windows/xdrip_tray.py)
          tag="windows-v${version}"
          (cd dist && sha256sum xDripTray.exe > xDripTray.exe.sha256)
          cat > notes.md <<NOTES
          Windows tray app + floating widget for xDrip+ Cloud Sync, version ${version}.

          Download **xDripTray.exe** and follow [the Windows instructions](https://github.com/${{ github.repository }}/blob/windows/windows/README.md).

          Not a medical device: rely on xDrip+ for alarms.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/xDripTray.exe dist/xDripTray.exe.sha256 --clobber
          else
            gh release create "$tag" dist/xDripTray.exe dist/xDripTray.exe.sha256 \
              --target "${{ github.sha }}" --title "xDrip+ Tray for Windows ${version}" --notes-file notes.md
          fi
